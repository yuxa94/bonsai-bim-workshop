n"], ["Blender", "Add-ons에서 활성화 → N 패널 → 서버 시작"], ["MCP 등록", "codex mcp add blender -- uvx mcp-for-blender"], ["연결 확인", "앱 재시작 → 다음 확인 프롬프트 실행"]], "images": [], "links": [{"name": "따라 하는 연결·설치 안내", "path": "guides/01-connect-and-install.md"}, {"name": "공식 MCP 저장소", "path": "https://github.com/ahujasid/mcp-for-blender"}], "prompt": "", "terms": [], "checks": [], "repair": "", "note": "신규 패키지 이름은 mcp-for-blender다. 예전 blender-mcp 이름은 호환된다. 앱의 연결 설정과 Blender 내 서버 실행이 모두 필요하다. 기존 MCP 서버의 설정을 먼저 확인해 중복 등록을 피한다."}, {"part": "01 · Blender MCP 연결", "time": "08–12분", "title": "1A · 지금 열린 Blender를 확인합니다", "lead": "연결 응답과 실제 작업 창을 함께 확인합니다.", "kind": "prompt", "rows": [], "images": [], "links": [], "prompt": "Blender MCP 연결을 확인해줘.\n실행 중인 Blender 버전, 현재 파일 경로와 장면 이름, 객체 수를 읽어줘.\n앞으로 사용할 창이 맞는지 확인하고 현재 장면은 수정하지 마.", "terms": [["현재 파일", "이후 작업의 대상 창을 식별합니다."], ["객체 수", "Blender 화면과 응답을 대조합니다."]], "checks": ["Blender 버전이 표시된다.", "MCP 대상 창과 장면이 맞다.", "기존 장면의 객체가 바뀌지 않았다."], "repair": "Blender MCP가 응답하지 않아. 애드온 활성화, 패널의 서버 시작 상태, Codex MCP 실행 명령과 포트 충돌을 순서대로 확인해줘.", "note": "읽기 확인만 진행한다. 여러 창이 열린 강사 PC에서는 특히 파일 경로와 대상 창을 확인한다."}, {"part": "02 · 설치하며 이해하기", "time": "12–25분", "title": "Bonsai 다운로드를 먼저 시작합니다", "lead": "Preferences → Get Extensions → Allow Online Access → Bonsai → Install", "kind": "visual", "rows": [], "images": [{"path": "images/install-bonsai-2.png", "caption": "공식 Bonsai 설치 문서: 온라인 접근 허용"}, {"path": "images/install-bonsai-3.png", "caption": "공식 Bonsai 설치 문서: Bonsai 검색·설치"}], "links": [{"name": "Bonsai 공식 설치 안내", "path": "https://docs.bonsaibim.org/studio/quickstart/installation.html"}], "prompt": "", "terms": [], "checks": [], "repair": "", "note": "공식 설치 문서의 실제 UI 이미지이며 학생 PC의 실행 캡처가 아니다. 출처: https://docs.bonsaibim.org/studio/quickstart/installation.html · Bonsai / IfcOpenShell Contributors. 검증 모델은 Blender 4.4/Bonsai 0.9.0post1 환경에서 제작했다. 학생 설치는 현재 공식 호환 안내를 따른다. 다운로드 중 다음 두 개념 슬라이드를 설명한다."}, {"part": "02 · 설치하며 이해하기", "time": "다운로드 중", "title": "Bonsai는 Blender 안의  기준", "같은 합계에 넣을 수 있는 경계인지 구분합니다."], ["미산출", "형상 없음을 면적 0으로 바꾸지 않습니다."]], "checks": ["출처 파일·GUID·층이 표에 있다.", "공간과 슬래브 면적을 분리했다.", "CSV·Excel과 화면의 선택 부재가 맞다."], "repair": "14개 공간 면적이 전부 0으로 나와. IfcSpace의 Representation을 확인하고 없으면 미산출로 남긴 뒤 슬래브 지표를 별도로 계산해줘.", "note": "면적 실습 ZIP에는 실행 진입점과 area_extract.py 엔진이 함께 있다. 설치 지연자는 예제 CSV/XLSX에서 GUID·기준·합계를 대조한다."}, {"part": "14 · 면적산출 실습", "time": "234–237분", "title": "숫자보다 먼저 면적 기준을 봅니다", "lead": "25B 공간 합계와 슬래브 합계가 다른 이유를 설명합니다.", "kind": "visual", "rows": [["25B", "IfcSpace 형상 합계 23.725600㎡ / 슬래브 합집합 30.190800㎡"], ["A32 5층", "일반 바닥 슬래브 합집합 994.531800㎡ / 공간 14개는 형상 없음"]], "images": [{"path": "area-lab/area-preview.png", "caption": "실제 IFC를 읽어 만든 면적 산출 실습 예제"}], "links": [], "prompt": "", "terms": [], "checks": [], "repair": "", "note": "수치는 같은 입력 해시에서 생성한 예제다. 법정 면적·마감 내측 면적과 같다고 확정하지 않는다. 실제 면적표 검증은 별도 보고서를 참고한다."}, {"part": "15 · 마무리", "time": "237–240분", "title": "파일과 스킬, 산출표를 함께 남깁니다", "lead": "다음 도면에 적용할 수 있는 작업 폴더가 오늘의 결과입니다.", "kind": "explain", "rows": [["유닛", "25B 수정 IFC와 54B 적용 결과"], ["스킬", "직접 만든 unit-bim과 floor-bim"], ["층", "기준층 수정본과 다른 층 시험본"], ["산출표", "출처·GUID·면적 기준이 있는 CSV/Excel"]], "images": [], "links": [{"name": "모든 단계의 복사 요청문", "path": "prompts.txt"}, {"name": "강사 운영 노트", "path": "instructor-notes.md"}, {"name": "Git 공개 저장소", "path": "https://github.com/yuxa94/bonsai-bim-workshop"}], "prompt": "", "terms": [], "checks": [], "repair": "", "note": "직접 실행한 범위와 제공 비교본을 구분한다. 설치·실행·수정·스킬·재사용·산출로 이어진 작업을 돌아본다."}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=0,reading=false,saved={};try{saved=JSON.parse(localStorage.getItem('bim-workshop-v2-checks')||'{}')}catch(e){}
const rows=r=>'<dl class="rows">'+r.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')+'</dl>';
const images=s=>'<div class="figure-grid">'+s.images.map(x=>`<figure><img loading="lazy" src="${esc(x.path)}" alt="${esc(x.caption)}" data-zoom="${esc(x.path)}"><figcaption>${esc(x.caption)}</figcaption></figure>`).join('')+'</div>';
function slideHTML(s,i){let head=`<header class="heading"><div class="section">${esc(s.part)}<small>${esc(s.time)}</small></div>${s.kind==='cover'?'':`<h2>${esc(s.title)}</h2>`}<div class="number">${String(i+1).padStart(2,'0')}</div></header>`;let body='';
 if(s.kind==='cover')body=`<div><h1>${esc(s.title)}</h1><p class="lead">${esc(s.lead)}</p><p class="kbd">MCP 연결 → 제작 → 상세 수정 → 스킬 → 재사용 → 산출</p></div><figure><img src="${s.images[0].path}" alt="${esc(s.images[0].caption)}"><figcaption>${esc(s.images[0].caption)}</figcaption></figure>`;
 else if(s.kind==='break')body=`<div><h2>${esc(s.title)}</h2><p class="lead">${esc(s.lead)}</p></div>`;
 else{head+=`<p class="lead">${esc(s.lead)}</p>`;
 if(s.kind==='prompt'){body=`<div class="two"><div><div class="bar"><span>GPT/CODEX에 입력 · 실습 폴더에서</span><button class="copy" data-copy="${i}">요청 복사</button></div><pre>${esc(s.prompt)}</pre><div class="message" role="status"></div><dl class="meanings">${s.terms.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></div><aside><div class="bar"><span>실행 후 직접 확인</span><span>체크</span></div><ul class="checklist">${s.checks.map((x,j)=>`<li><label><span class="num">${String(j+1).padStart(2,'0')}</span><span>${esc(x)}</span><input type="checkbox" data-check="${i}-${j}" aria-label="${esc(x)}" ${saved[i+'-'+j]?'checked':''}></label></li>`).join('')}</ul></aside></div>`}
 else if(s.kind==='visual'){body=images(s)+(s.rows.length?rows(s.rows):'')}
 else if(s.images.length)body=`<div class="with-image">${rows(s.rows)}${images(s)}</div>`;
 else body=rows(s.rows);
 }
 const links=s.links.length?`<div class="downloads">${s.links.map(x=>`<a href="${esc(x.path)}" target="_blank" rel="noopener">↓ ${esc(x.name)}</a>`).join('')}</div>`:'';
 const repair=s.repair?`<div class="repair"><strong>안 되면</strong><p>${esc(s.repair)}</p><button class="copy" data-repair="${i}">다시 요청 복사</button></div>`:'';
 return `<article class="slide ${s.kind}" data-index="${i}">${head}<div class="body">${body}</div>${links}${repair}</article>`;
}
function render(){const n=Number(location.hash.slice(1));current=Number.isInteger(n)&&n>=1&&n<=slides.length?n-1:0;$('#stage').innerHTML=reading?slides.map(slideHTML).join(''):slideHTML(slides[current],current);$('.count').textContent=`${current+1} / ${slides.length}`;$('.progress').style.width=(current+1)/slides.length*100+'%';$('#prev').disabled=current===0;$('#next').disabled=current===slides.length-1;document.title=`${current+1}. ${slides[current].title.replaceAll('\n',' ')} · BIM 워크숍`;bind();}
function go(n){location.hash=Math.max(1,Math.min(slides.length,n))}
async function copy(text,button){try{await navigator.clipboard.writeText(text);button.textContent='복사 완료';setTimeout(()=>button.textContent=button.dataset.repair?'다시 요청 복사':'요청 복사',1600)}catch(e){let pre=button.closest('.slide').querySelector('pre');if(!pre){modal(`<h3>복사할 요청문</h3><pre>${esc(text)}</pre>`);pre=$('#modal pre')}const range=document.createRange();range.selectNodeContents(pre);let sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);button.textContent='Ctrl+C로 복사'}}
function bind(){document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(slides[Number(b.dataset.copy)].prompt,b));document.querySelectorAll('[data-repair]').forEach(b=>b.onclick=()=>copy(slides[Number(b.dataset.repair)].repair,b));document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{saved[b.dataset.check]=b.checked;try{localStorage.setItem('bim-workshop-v2-checks',JSON.stringify(saved))}catch(e){}});document.querySelectorAll('[data-zoom]').forEach(im=>im.onclick=()=>{modal(`<img src="${im.dataset.zoom}" alt="${esc(im.alt)}"><p>${esc(im.alt)}</p>`);$('#modal').classList.add('zoom')});}
function modal(html){$('#modal').classList.remove('zoom');$('#modalbody').innerHTML=html;$('#modal').showModal()}
$('#modal .close').onclick=()=>$('#modal').close();$('#prev').onclick=()=>go(current);$('#next').onclick=()=>go(current+2);$('#notes').onclick=()=>modal(`<h3>강사 노트 · ${current+1}</h3><p>${esc(slides[current].note)}</p>`);
$('#toc').onclick=()=>{modal('<h3>전체 슬라이드</h3><input class="search" placeholder="제목·단계 검색" aria-label="슬라이드 검색"><div class="toc"></div>');const draw=()=>{$('.toc').innerHTML=slides.map((s,i)=>({...s,i})).filter(s=>(s.title+s.part).includes($('.search').value)).map(s=>`<button data-goto="${s.i+1}"><small>${s.i+1} · ${esc(s.part)}</small>${esc(s.title)}</button>`).join('');document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{reading=false;document.body.classList.remove('read');go(Number(b.dataset.goto));$('#modal').close();render()})};$('.search').oninput=draw;draw()};
$('#resources').onclick=()=>{window.open('downloads.html','_blank','noopener')};$('#read').onclick=()=>{reading=!reading;document.body.classList.toggle('read',reading);$('#read').textContent=reading?'발표':'읽기';render()};$('#fullscreen').onclick=async()=>{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()};$('#print').onclick=()=>{reading=true;document.body.classList.add('read');render();window.print()};
window.addEventListener('hashchange',()=>{render();if(!reading)window.scrollTo(0,0)});window.addEventListener('keydown',e=>{if($('#modal').open||['INPUT','TEXTAREA'].includes(e.target.tagName))return;const k=e.key.toLowerCase();if(['arrowright','pagedown',' '].includes(k)){e.preventDefault();go(current+2)}else if(['arrowleft','pageup'].includes(k)){e.preventDefault();go(current)}else if(k==='home')go(1);else if(k==='end')go(slides.length);else if({n:'notes',g:'toc',r:'resources',f:'fullscreen'}[k])$('#'+{n:'notes',g:'toc',r:'resources',f:'fullscreen'}[k]).click()});render();
</script></body></html>
